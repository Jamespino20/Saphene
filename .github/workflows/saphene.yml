name: Saphene

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Checkout MatriFlow target (pinned)
        uses: actions/checkout@v4
        with:
          repository: Jamespino20/matriflow
          ref: 1b00b467038684b27d7d7b97d74f78e033e58fa8
          path: targets/matriflow

      - name: Checkout AnvilOS target (pinned)
        uses: actions/checkout@v4
        with:
          repository: Jamespino20/AnvilOS
          ref: 4576fe9f1727de160520be0d03fb96d906084a49
          path: targets/anvilos

      - name: Configure model (optional)
        env:
          SAPHENE_API_KEY: ${{ secrets.SAPHENE_API_KEY }}
        run: |
          if [ -n "$SAPHENE_API_KEY" ]; then
            printf 'MODEL_BASE_URL=%s\nMODEL_API_KEY=%s\nMODEL_NAME=%s\nMODEL_FALLBACK=%s\n' \
              "https://generativelanguage.googleapis.com/v1beta/openai" \
              "$SAPHENE_API_KEY" \
              "gemini-3.1-flash-lite" \
              "gemini-flash-latest" > .env
          else
            echo "No SAPHENE_API_KEY secret; running heuristic mode."
          fi

      - name: Verify MatriFlow claims
        shell: bash
        run: |
          set -o pipefail
          npx tsx saphene bridge examples/matriflow-claims.md --repo targets/matriflow | tee bridge-matriflow.txt

      - name: Verify AnvilOS claims
        shell: bash
        run: |
          set -o pipefail
          npx tsx saphene bridge examples/anvilos-claims.md --repo targets/anvilos | tee bridge-anvilos.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Saphene verdicts"
            echo "### MatriFlow"
            'cat' bridge-matriflow.txt 2>/dev/null || echo "(step did not run)"
            echo
            echo "### AnvilOS"
            'cat' bridge-anvilos.txt 2>/dev/null || echo "(step did not run)"
          } >> "$GITHUB_STEP_SUMMARY"
