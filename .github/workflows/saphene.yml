name: Saphene

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Self-test (portable fixtures)
        run: npx tsx saphene test

      - name: Build CLI
        run: npm run build:cli

      - name: Checkout MatriFlow target (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jamespino20/matriflow
          ref: 1b00b467038684b27d7d7b97d74f78e033e58fa8
          path: targets/matriflow

      - name: Checkout AnvilOS target (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jamespino20/AnvilOS
          ref: 4576fe9f1727de160520be0d03fb96d906084a49
          path: targets/anvilos

      # Optional model config for manual/model-backed steps. The gate below
      # stays deterministic (--no-model) regardless of which keys exist.
      - name: Configure model (optional)
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SAPHENE_API_KEY: ${{ secrets.SAPHENE_API_KEY }}
        run: |
          if [ -n "$META_API_KEY" ]; then
            {
              printf 'MODEL_BASE_URL=%s\nMODEL_API_KEY=%s\nMODEL_NAME=%s\n' \
                "https://api.meta.ai/v1" "$META_API_KEY" "muse-spark-1.3-contributor"
              if [ -n "$GOOGLE_API_KEY" ]; then
                printf 'MODEL_FALLBACK_BASE_URL=%s\nMODEL_FALLBACK_API_KEY=%s\nMODEL_FALLBACK_MODEL=%s\n' \
                  "https://generativelanguage.googleapis.com/v1beta/openai" "$GOOGLE_API_KEY" "gemini-3.5-flash"
              fi
            } > .env
            echo "Meta primary configured (provider fallback if Google key present)."
          elif [ -n "$GOOGLE_API_KEY" ] || [ -n "$SAPHENE_API_KEY" ]; then
            printf 'MODEL_BASE_URL=%s\nMODEL_API_KEY=%s\nMODEL_NAME=%s\n' \
              "https://generativelanguage.googleapis.com/v1beta/openai" \
              "${GOOGLE_API_KEY:-$SAPHENE_API_KEY}" "gemini-3.5-flash" > .env
            echo "Google-only model configured."
          else
            echo "No model secrets; running heuristic mode."
          fi

      - name: Verify MatriFlow claims (deterministic)
        shell: bash
        run: |
          set -o pipefail
          npx tsx saphene bridge examples/matriflow-claims.md --repo targets/matriflow --no-model | tee bridge-matriflow.txt

      - name: Verify AnvilOS claims (deterministic)
        shell: bash
        run: |
          set -o pipefail
          npx tsx saphene bridge examples/anvilos-claims.md --repo targets/anvilos --no-model | tee bridge-anvilos.txt

      - name: Upload verdict artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: saphene-verdicts
          path: |
            bridge-matriflow.txt
            bridge-anvilos.txt
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Saphene verdicts"
            echo "### MatriFlow"
            'cat' bridge-matriflow.txt 2>/dev/null || echo "(step did not run)"
            echo
            echo "### AnvilOS"
            'cat' bridge-anvilos.txt 2>/dev/null || echo "(step did not run)"
          } >> "$GITHUB_STEP_SUMMARY"
