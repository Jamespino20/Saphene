name: Saphene Nightly Drift Watch

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: saphene-nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Checkout MatriFlow target (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jamespino20/matriflow
          ref: 1b00b467038684b27d7d7b97d74f78e033e58fa8
          path: targets/matriflow

      - name: Checkout AnvilOS target (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jamespino20/AnvilOS
          ref: 4576fe9f1727de160520be0d03fb96d906084a49
          path: targets/anvilos

      - name: Nightly review (both targets)
        id: nightly-review
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          status=0
          npx tsx saphene review --claims examples/matriflow-claims.md --repo targets/matriflow --ledger baselines/matriflow.ledger.json | tee nightly-matriflow.md || status=1
          npx tsx saphene review --claims examples/anvilos-claims.md --repo targets/anvilos --ledger baselines/anvilos.ledger.json | tee nightly-anvilos.md || status=1
          exit $status

      - name: Open drift issue (on failure)
        if: steps.nightly-review.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'Nightly Saphene review detected drift or an unchecked gate.'
            echo
            'cat' nightly-matriflow.md 2>/dev/null || echo '(MatriFlow review did not run)'
            echo
            'cat' nightly-anvilos.md 2>/dev/null || echo '(AnvilOS review did not run)'
          } > nightly-report.md
          gh issue create \
            --title "Saphene nightly drift detected ($(date -u +%F))" \
            --body-file nightly-report.md

      - name: Upload nightly artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: saphene-nightly
          path: |
            nightly-matriflow.md
            nightly-anvilos.md
            nightly-report.md
          if-no-files-found: ignore

      - name: Nightly result
        if: always()
        run: |
          if [ "${{ steps.nightly-review.outcome }}" = "failure" ]; then
            echo "Nightly drift detected (issue opened)."
            exit 1
          fi
          echo "No nightly drift."
